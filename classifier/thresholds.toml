# Probability thresholds per risk (pipeline/risk_classifier.py), checked with `copilot eval risks`.
# 0.5 = the classifier's natural decision point. Held-out result (62 cases, 12 languages):
# recall 42/42, precision 0.84, no false alarm at the strong level (2026-11-23).
# weak   = recorded and shown, decided together with the LLM safety call
# strong = blocks the risky part on its own
# Tuned for RECALL on hard-rule risks: a false alarm costs a person one minute, a miss is a breach.
[risk.trading_advice]
weak = 0.5
strong = 0.8
[risk.complaint]
weak = 0.5
strong = 0.8
[risk.kyc_decision]
weak = 0.5
strong = 0.8
[risk.aml_compliance]
weak = 0.5
strong = 0.8
[risk.vulnerable_customer]
weak = 0.5
strong = 0.8
[risk.security_sensitive]
weak = 0.5
strong = 0.8
[risk.prompt_injection]
weak = 0.5
strong = 0.8

# The injection gate (pipeline/injection.py), measured with `copilot eval injection`:
# guard = NeuralTrust prompt-guard-oss-small (INJECTION_GUARD_MODEL); head = our bge-m3 head,
# a backup that fires only at head_detect (0.6: below it, it mostly flags polite messages).
# NOTE: 0.6 was chosen after seeing the 165-case result; re-check on fresh/real tickets.
[injection]
guard_weak = 0.5
guard_strong = 0.8
head_detect = 0.6
