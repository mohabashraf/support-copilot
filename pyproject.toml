[project]
name = "copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mohab Nazmy", email = "10837755+mohabashraf@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.2",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sentence-transformers>=6.3.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
copilot = "copilot.main:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# ---- Code style: PEP 8, enforced by Ruff (format + lint) ----
[tool.ruff]
line-length = 99          # PEP 8 allows teams to agree on up to 99
target-version = "py312"
extend-exclude = ["knowledge_base/raw"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle: the PEP 8 rules (indentation, whitespace, line length, ...)
  "F",        # pyflakes: unused imports/variables, undefined names
  "I",        # isort: import order (stdlib → third-party → our code)
  "N",        # pep8-naming: snake_case functions, CapWords classes, ...
  "B",        # bugbear: likely bugs (mutable defaults, ...)
  "UP",       # pyupgrade: modern Python 3.12 syntax
  "SIM",      # simplify: needlessly complex code
]
ignore = ["B008"]  # FastAPI/Typer use function calls in defaults (Depends(), typer.Option()) by design

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

[tool.ruff.format]
quote-style = "double"
