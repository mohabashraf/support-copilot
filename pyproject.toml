[project]
name = "copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mohab Nazmy", email = "10837755+mohabashraf@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.2",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
copilot = "copilot.main:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
