[project]
name = "copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mohab Nazmy", email = "10837755+mohabashraf@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "en-core-web-sm",
    "fastapi>=0.163.2",
    "gliner>=0.2.30",
    "langchain-anthropic>=1.7.12",
    "langgraph>=1.2.24",
    "numpy>=2.5.5",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "presidio-analyzer>=2.2.362",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "sentencepiece<0.2.3",
    "torch>=2.15.0",  # direct dependency so the CPU-only source below applies
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

# Linux (Docker, CI): CPU-only PyTorch. The default Linux wheels pull ~3 GB of NVIDIA GPU
# libraries we never use (embeddings run on CPU). macOS keeps the normal PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
copilot = "copilot.cli:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "langgraph-cli[inmem]>=0.4.43",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# ---- Code style: PEP 8, enforced by Ruff (format + lint) ----
[tool.ruff]
line-length = 99          # PEP 8 allows teams to agree on up to 99
target-version = "py312"
extend-exclude = ["knowledge_base/raw"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle: the PEP 8 rules (indentation, whitespace, line length, ...)
  "F",        # pyflakes: unused imports/variables, undefined names
  "I",        # isort: import order (stdlib → third-party → our code)
  "N",        # pep8-naming: snake_case functions, CapWords classes, ...
  "B",        # bugbear: likely bugs (mutable defaults, ...)
  "UP",       # pyupgrade: modern Python 3.12 syntax
  "SIM",      # simplify: needlessly complex code
  "PLC0415",  # PEP 8: imports at the top of the file. A deliberate exception needs `# noqa: PLC0415`
]
ignore = ["B008"]  # FastAPI/Typer use function calls in defaults (Depends(), typer.Option()) by design

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

[tool.ruff.format]
quote-style = "double"
